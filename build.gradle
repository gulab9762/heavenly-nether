plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.1' apply false
    id 'net.neoforged.moddev' version '2.0.147' apply false
}

tasks.register('universalJar', Jar) {
    group = 'build'
    description = 'Builds a single unified universal JAR compatible with Fabric, NeoForge, and Forge.'
    dependsOn ':fabric:jar', ':neoforge:jar', ':forge:jar'

    archiveBaseName.set("${project.mod_id}-universal")
    archiveVersion.set("${project.minecraft_version}-${project.version}")
    destinationDirectory.set(layout.buildDirectory.dir("libs"))

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // 1. Include Fabric outputs (common + fabric classes + fabric.mod.json + icon.png)
    from(zipTree(project(':fabric').tasks.named('jar').get().archiveFile)) {
        exclude 'META-INF/MANIFEST.MF'
    }

    // 2. Include NeoForge outputs (neoforge classes + META-INF/neoforge.mods.toml)
    from(zipTree(project(':neoforge').tasks.named('jar').get().archiveFile)) {
        exclude 'META-INF/MANIFEST.MF'
    }

    // 3. Include Forge outputs (forge classes + META-INF/mods.toml)
    from(zipTree(project(':forge').tasks.named('jar').get().archiveFile)) {
        exclude 'META-INF/MANIFEST.MF'
    }

    manifest {
        attributes([
            'Specification-Title'     : project.mod_name,
            'Specification-Vendor'    : project.mod_author,
            'Specification-Version'   : project.version,
            'Implementation-Title'    : project.mod_name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : project.mod_author,
            'Fabric-Loom-Remap'       : 'false',
            'MixinConfigs'            : "${project.mod_id}.mixins.json"
        ])
    }
}

tasks.register('buildUniversal') {
    group = 'build'
    description = 'Builds the unified universal JAR.'
    dependsOn 'universalJar'
}

tasks.register('buildAllMods') {
    group = 'build'
    description = 'Builds all supported mod loader JARs and the unified universal JAR.'
    dependsOn ':fabric:build', ':neoforge:build', ':forge:build', 'universalJar'
}

// Fabric Tasks
tasks.register('buildFabric') {
    group = 'fabric'
    description = 'Builds the Fabric mod JAR.'
    dependsOn ':fabric:build'
}

tasks.register('runFabricClient') {
    group = 'fabric'
    description = 'Runs the Fabric development client.'
    dependsOn ':fabric:runClient'
}

tasks.register('runFabricServer') {
    group = 'fabric'
    description = 'Runs the Fabric development server.'
    dependsOn ':fabric:runServer'
}

tasks.register('cleanFabric') {
    group = 'fabric'
    description = 'Cleans Fabric build outputs.'
    dependsOn ':fabric:clean'
}

// NeoForge Tasks
tasks.register('buildNeoForge') {
    group = 'neoforge'
    description = 'Builds the NeoForge mod JAR.'
    dependsOn ':neoforge:build'
}

tasks.register('runNeoForgeClient') {
    group = 'neoforge'
    description = 'Runs the NeoForge development client.'
    dependsOn ':neoforge:runClient'
}

// Forge Tasks
tasks.register('buildForge') {
    group = 'forge'
    description = 'Builds the Forge mod JAR.'
    dependsOn ':forge:build'
}

tasks.register('cleanForge') {
    group = 'forge'
    description = 'Cleans Forge build outputs.'
    dependsOn ':forge:clean'
}

// Notification Task
tasks.register('notifyBuildComplete') {
    group = 'notification'
    description = 'Sends a notification to ntfy.sh/antigravity upon build completion.'
    doLast {
        def ntfyUrl = new URI('https://ntfy.sh/antigravity').toURL()
        def conn = ntfyUrl.openConnection() as HttpURLConnection
        conn.requestMethod = 'POST'
        conn.doOutput = true
        conn.setRequestProperty('Title', 'Tree Shake Mod Built')
        conn.setRequestProperty('Tags', 'white_check_mark,package')
        conn.outputStream.withWriter('UTF-8') { writer ->
            writer.write("Tree Shake mod build finished successfully for Minecraft ${project.minecraft_version}!")
        }
        def responseCode = conn.responseCode
        println "Notification sent to ntfy.sh/antigravity (Status: ${responseCode})"
    }
}
