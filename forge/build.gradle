plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
}

repositories {
    mavenCentral()
    maven {
        name = 'MinecraftForge'
        url = uri('https://maven.minecraftforge.net')
    }
}

dependencies {
    compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.3'))

    compileOnly(files(
        'D:/MultiMC/libraries/net/minecraftforge/forge/26.3-66.0.10/forge-26.3-66.0.10-universal.jar',
        'D:/MultiMC/libraries/net/minecraftforge/fmlcore/26.3-66.0.10/fmlcore-26.3-66.0.10.jar',
        'D:/MultiMC/libraries/net/minecraftforge/javafmllanguage/26.3-66.0.10/javafmllanguage-26.3-66.0.10.jar',
        'D:/MultiMC/libraries/net/minecraftforge/eventbus/7.0.6/eventbus-7.0.6.jar',
        'D:/MultiMC/libraries/net/minecraftforge/mergetool/1.1.5/mergetool-1.1.5-api.jar'
    ))
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'forge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'forge')
            }
        }
    }
}
